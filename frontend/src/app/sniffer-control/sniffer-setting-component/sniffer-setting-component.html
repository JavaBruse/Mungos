<div [class.active]="snifferId" class="card-layout" [formGroup]="form">
    <div class="card-main card-component-padding">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Фильтрованные адреса и порты</mat-label>
            <mat-chip-grid #chipGrid>
                @for (word of filterArray.controls; track word; let i = $index) {
                <mat-chip-row (removed)="removeWord(i)">
                    {{ word.value }}
                    <button matChipRemove [attr.aria-label]="'remove ' + word.value">
                        <mat-icon>cancel</mat-icon>
                    </button>
                </mat-chip-row>
                }
            </mat-chip-grid>
            <input placeholder="ip:port или ip или port" #wordInput
                (keyup.enter)="addFilter(wordInput.value); wordInput.value='';" [matChipInputFor]="chipGrid" />
        </mat-form-field>
    </div>

    <!-- Кнопки -->
    <div class="card-side">
        <a class="button-size" (click)="cancel()" matTooltip="Отмена">
            <mat-icon>cancel</mat-icon>
        </a>
        <a class="button-size" (click)="save()" matTooltip="Сохранить">
            <mat-icon>save</mat-icon>
        </a>
    </div>
</div>
