<div class="grafana-wrapper">
    <button class="maximize-btn" mat-icon-button (click)="toggleMaximize()" (mouseenter)="showTooltip()"
        (mouseleave)="hideTooltip()">
        <mat-icon>{{ isMaximized ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
    <div class="custom-tooltip" [class.visible]="tooltipVisible">
        {{ tooltipText }}
    </div>
    <div class="iframe-container" [class.maximized]="isMaximized">
        @if(safeUrl){
        <iframe [src]="safeUrl" width="100%" height="100%" frameborder="0"></iframe>
        }
    </div>
</div>
