syntax = "proto3";

package sniffer;

option go_package = "./core/grpc/proto;snifferpb";

service SnifferService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetMetrics(AuthRequest) returns (MetricsResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetFilteredPackage(PackageFilterRequest) returns (stream TrafficPacket);
  rpc GetPacketPayload(PayloadRequest) returns (PayloadResponse);
  rpc GetSettings(SettingRequest) returns (SettingResponse);
  rpc SetSettings(SettingRequest) returns (SettingResponse);
  rpc DownloadJA4Database(Ja4DataChunkRequest) returns (stream Ja4DataChunk);
  rpc UploadJA4Database(stream Ja4DataChunk) returns (Ja4DataChunkResponse);
  rpc UpdateOrSaveJa4Entry(JA4Entry) returns (JA4Entry);
  rpc DownloadSNIDatabase(SNIDataChunkRequest) returns (stream SNIDataChunk);
  rpc UploadSNIDatabase(stream SNIDataChunk) returns (SNIDataChunkResponse);
  rpc UpdateOrSaveSNIEntry(SNIEntry) returns (SNIEntry);
  rpc GetHashSNIandJa4HashTable(AuthRequest) returns (HashTable);
  rpc GetConnectionInsight(ConnectionInsightRequest) returns (ConnectionInsight);
  rpc UpdateConnectionInsight(UpdateConnectionInsightRequest) returns (UpdateConnectionInsightResponse);
}

message UpdateConnectionInsightRequest {
  string session_key = 1;
  string packet_id = 2;
  string ja4_entry_id = 3;
  string sni_entry_id = 4;
}

message UpdateConnectionInsightResponse {
  bool success = 1;
  string message = 2;
}

message ConnectionInsightRequest {
  string session_key = 1;
  string packet_id = 2;
}

message ConnectionInsight {
  string local_ip = 1;
  repeated uint32 local_ports = 2;
  string remote_ip = 3;
  uint32 remote_port = 4;
  int64 total_packets = 5;
  int64 total_bytes = 6;
  int64 first_packet_time = 7;
  int64 last_packet_time = 8;
  int64 syn_count = 9;
  int64 fin_count = 10;
  int64 rst_count = 11;
  int64 identified_packets = 12;
  repeated JA4Candidate ja4_candidates = 13;
  repeated SNICandidate sni_candidates = 14;
}

message JA4Candidate {
  string id = 1;
  string fingerprint = 2;
  string application = 3;
  string device = 4;
  string os = 5;
  int64 count = 6;
  int32 confidence = 7;
  int32 hop = 8;
}

message SNICandidate {
  string id = 1;
  string sni = 2;
  string service = 3;
  int64 count = 4;
  int32 confidence = 5;
  int32 hop = 6;
}

message HashTable {
  uint64 sni_hash = 1;
  uint64 ja4_hash = 2;
}

message SNIEntry {
    string id = 1;
    string service = 2;
    string sni = 3;
    int32 occurrence_count = 4;
    int64 first_seen = 5;     
    int64 last_seen = 6;   
    string session_key = 7;
}

message SNIEntryList {
    repeated SNIEntry entries = 1;
}

message SNIDataChunk {
    string session_key = 1;
    bytes data = 2;
    bool is_last = 3;
    int32 total_size = 4;
}

message SNIDataChunkRequest {
    string session_key = 1;
}

message SNIDataChunkResponse {
    bool success = 1;
    string message = 2;
    int32 total_chunks = 3;
}

message JA4Entry {
    string id = 1;
    string fingerprint = 2;
    string application = 3;
    string library = 4;
    string device = 5;
    string os = 6;
    int32 observation_count = 7;
    bool verified = 8;
    string fingerprint_type = 9;
    string session_key = 10;
    int64 updated_at = 11;
}

message JA4EntryList {
    repeated JA4Entry entries = 1;
}


message Ja4DataChunk {
    string session_key = 1;
    bytes data = 2;
    bool is_last = 3;
    int32 total_size = 4;
}

message Ja4DataChunkRequest {
    string session_key = 1;
}

message Ja4DataChunkResponse {
    bool success = 1;
    string message = 2;
    int32 total_chunks = 3;
}

message PayloadRequest {
  string session_key = 1;
  string packet_id = 2;
}

message PayloadResponse {
  bytes payload = 1;
}

message PackageFilterRequest {
  string session_key = 1;
  FilterExpression filter = 2;
  int32 limit = 3; 
  int32 offset = 4;
}

message FilterExpression {
  repeated string protocols = 1;      // ["TCP", "UDP", "HTTP"]
  repeated int32 ports = 2;           // [80, 443, 53]
  repeated string ips = 3;            // ["192.168.1.1", "10.0.0.1"]
  int64 start_time = 4;                // с какого времени
  int64 end_time = 5;                  // по какое время
  string text_search = 6;              // поиск по содержимому
  map<string, string> custom = 7;      // кастомные фильтры
  bool unknown_only = 8;
  bool known_only = 9;
}

message TrafficPacket {
  string packet_id = 1;
  int64 timestamp = 2;
  repeated string protocol_stack = 3;
  int32 src_port = 4;
  int32 dst_port = 5;
  string src_ip = 6;
  string dst_ip = 7;
  int32 length = 8;
  bytes payload = 9;
  map<string, string> headers = 10;
  string method = 11;
  string uri = 12;
  int32 status = 13;
  string dns_query = 14;
  string dns_answer = 15;
  int32 ttl = 16;
  string tcp_flags = 17;

  // MAC и Vendor (18-25)
  string src_mac = 18;
  string dst_mac = 19;
  string src_vendor = 20;
  string dst_vendor = 21;
  
  // JA4 fields (22-27)
  string ja4_raw = 22;
  string ja4_type = 23;
  string ja4_application = 24;
  string ja4_device = 25;
  string ja4_os = 26;
  bool ja4_verified = 27;
  int32 ja4_confidence = 28;
  
  // SNI fields (28-29)
  string sni = 29;
  string sni_service = 30;

  // IP Type fields (32-33)
  string src_ip_type = 31;
  string dst_ip_type = 32;
}

message RegisterRequest {
  string master_key = 1;
  string session_key = 2;
}

message RegisterResponse {
  bool success = 1;
  string session_key = 2;
  string message = 3;
  string server_certificate = 4;
}


message SettingRequest {
  string session_key = 1;
  string filters = 2;
}

message SettingResponse {
  string filters = 1;
  int64 timestamp = 2;
}

message AuthRequest {
  string session_key = 1;
}

message MetricsResponse {
  // Основные счетчики трафика
  int64 packets_count = 1;
  int64 bytes_total = 2;
  map<string, int64> protocols = 3;
  map<string, int64> well_known_ports = 4;
  string error = 5;

  // Временная аналитика
  int64 packets_per_second = 6;
  double bytes_per_second = 7;

  // TCP специфика
  int64 tcp_connections = 8;
  int64 tcp_syn_packets = 9;
  int64 tcp_fin_packets = 10;
  int64 tcp_rst_packets = 11;

  // Топ сервисов (по именам)
  map<string, int64> top_services = 12;

  // Топ приложений (по названиям)
  map<string, int64> top_applications = 13;

  // Известные/неизвестные пакеты общие
  int64 all_know = 14;
  int64 all_unknow = 15;

  // Известные/неизвестные пакеты за последние 5 секунд
  int64 known_packets_5sec = 16;
  int64 unknown_packets_5sec = 17;

  map<string, int64> top_services_by_connections = 18;
}

message PingRequest {
  string session_key = 1;
  string message = 2;
}

message PingResponse {
  string message = 1;
  int64 timestamp = 2;
}